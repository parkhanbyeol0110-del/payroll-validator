{% extends "base.html" %}
{% block title %}급여 파일 업로드{% endblock %}
{% block content %}
<h1>급여 파일 업로드</h1>
<p class="page-desc">마감 전 급여 파일을 업로드하면 자동으로 검증 규칙을 실행합니다.</p>

<div class="card">
  <form method="post" enctype="multipart/form-data" class="upload-form">
    <label>급여 기준월</label>
    <input type="month" name="payroll_month" required>

    <label>급여 파일 (xlsx, xls, csv)</label>
    <input type="file" name="payroll_file" accept=".xlsx,.xls,.csv" required>

    <button type="submit">업로드 및 검증 시작</button>
  </form>
</div>

<div class="card">
  <h2>필수 컬럼 안내</h2>
  <table class="simple-table">
    <thead><tr><th>사번</th><th>성명</th><th>조직</th><th>직급</th><th>기본급</th><th>수당</th><th>상여</th><th>공제</th><th>실지급액</th></tr></thead>
    <tbody><tr><td>10021</td><td>홍길동</td><td>인사팀</td><td>대리</td><td>3,000,000</td><td>200,000</td><td>0</td><td>150,000</td><td>3,050,000</td></tr></tbody>
  </table>
  <p class="hint">사번 / 성명 / 조직 / 기본급 / 실지급액은 필수입니다. 직급, 수당, 상여, 공제는 없으면 0으로 처리됩니다.</p>
</div>
{% endblock %}
