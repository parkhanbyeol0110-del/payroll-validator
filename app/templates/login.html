{% extends "base.html" %}
{% block title %}로그인 - 급여 검증 시스템{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <h1>급여 마감 전 검증 시스템</h1>
    <p class="subtitle">로그인 후 이용해 주세요.</p>

    <form method="post">
      <label>아이디</label>
      <input type="text" name="username" autofocus required>
      <label>비밀번호</label>
      <input type="password" name="password" required>
      <button type="submit">로그인</button>
    </form>
    <p class="hint">기본 관리자 계정: admin / admin1234</p>
  </div>
</div>
{% endblock %}
