{% extends "base.html" %}
{% block title %}검증 Rule 관리{% endblock %}
{% block content %}
<div class="page-header">
  <h1>검증 Rule 관리</h1>
</div>

<div class="card">
  <table class="simple-table">
    <thead><tr><th>코드</th><th>이름</th><th>설명</th><th>심각도</th><th>기준값</th><th>활성화</th></tr></thead>
    <tbody>
      {% for r in rules %}
      <tr>
        <td>{{ r.rule_code }}</td>
        <td>{{ r.rule_name }}</td>
        <td>{{ r.description }}</td>
        <td><span class="badge badge-{{ r.severity|lower }}">{{ severity_label(r.severity) }}</span></td>
        <td>
          <form method="post" action="{{ url_for('dashboard.update_threshold', rule_id=r.id) }}" class="inline-form">
            <input type="number" step="0.01" name="threshold" value="{{ r.threshold if r.threshold is not none else '' }}" style="width:80px">
            <button type="submit" class="btn-sm">저장</button>
          </form>
        </td>
        <td>
          <form method="post" action="{{ url_for('dashboard.toggle_rule', rule_id=r.id) }}">
            <button type="submit" class="btn-sm {{ 'btn-secondary' if not r.is_active }}">
              {{ 'ON' if r.is_active else 'OFF' }}
            </button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
