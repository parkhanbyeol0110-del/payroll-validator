{% extends "base.html" %}
{% block title %}검증 이력{% endblock %}
{% block content %}
<div class="page-header">
  <h1>검증 이력 / 업무량 분석</h1>
</div>

{% if clients %}
<div class="filter-row">
  <span class="filter-label">고객사</span>
  <a href="{{ url_for('dashboard.history') }}" class="{{ 'active' if not selected_client }}">전체</a>
  {% for c in clients %}
  <a href="{{ url_for('dashboard.history', company=c) }}" class="{{ 'active' if c == selected_client }}">{{ c }}</a>
  {% endfor %}
</div>
{% endif %}

<div class="card">
  <div id="historyGrid" class="ag-theme-balham grid-panel"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
  var historyRows = [
    {% for u, s in rows %}
    {
      client_name: {{ u.client_name|tojson }},
      month: {{ u.payroll_month|tojson }},
      uploaded_at: {{ u.uploaded_at.strftime('%Y-%m-%d %H:%M')|tojson }},
      uploader: {{ u.uploader.name|tojson }},
      headcount: {{ u.employee_count }},
      critical: {{ s.critical_count }},
      warning: {{ s.warning_count }},
      info: {{ s.info_count }},
      resolved: {{ s.resolved_count }},
      unresolved: {{ s.unresolved_count }},
      url: {{ url_for('dashboard.upload_detail', upload_id=u.id)|tojson }},
    },
    {% endfor %}
  ];

  PV.initGrid('historyGrid', [
    { field: 'client_name', headerName: '고객사', maxWidth: 130 },
    { field: 'month', headerName: '기준월', maxWidth: 100 },
    { field: 'uploaded_at', headerName: '업로드 일시', maxWidth: 160 },
    { field: 'uploader', headerName: '업로드자', maxWidth: 100 },
    { field: 'headcount', headerName: '인원', maxWidth: 90 },
    { field: 'critical', headerName: '오류', maxWidth: 80 },
    { field: 'warning', headerName: '경고', maxWidth: 80 },
    { field: 'info', headerName: '참고', maxWidth: 80 },
    { field: 'resolved', headerName: '처리완료', maxWidth: 100 },
    { field: 'unresolved', headerName: '미처리', maxWidth: 90 },
    { headerName: '', maxWidth: 90, sortable: false, filter: false,
      cellRenderer: function (p) { return '<a href="' + p.data.url + '">상세 →</a>'; } },
  ], historyRows, { pagination: false });
</script>
{% endblock %}
